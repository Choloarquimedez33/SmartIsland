# Custom Smart Island build: applies smartisland-custom.patch (no INTERNET / location / calendar permissions + edge light)
# and builds an installable debug APK. Run it by hand from the Actions tab ("Run workflow").
#
# Put this file at .github/workflows/build-custom.yml and smartisland-custom.patch at the root of the repository.

name: Build custom APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Apply patch and build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Apply custom patch
        run: |
          git apply --check smartisland-custom.patch
          git apply smartisland-custom.patch
          git status --short

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      # No lint or tests on purpose: only what is needed to get an APK.
      - name: Build debug APK
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      # Prints the permissions the built APK really declares, so you can check there is no INTERNET in it.
      - name: Show permissions of the built APK
        continue-on-error: true
        run: |
          AAPT2="$(ls -d "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)"
          echo "Using $AAPT2"
          "$AAPT2" dump permissions app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SmartIsland-Custom-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
