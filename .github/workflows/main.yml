+        serviceScope.launch {
+            runSuspendCatchingLogged(TAG, "Edge light collector failed") {
+                // Maps each message / call card to the time it was posted, so a new one (or a fresh message in an old chat) lights the edge.
+                var seen: Map<String, Long>? = null
+                notificationRepository.notifications.collect { list ->
+                    if (destroyed) return@collect
+                    val current = list
+                        .filter {
+                            it.mode == com.agupta07505.smartisland.model.IslandMode.Notification ||
+                                it.mode == com.agupta07505.smartisland.model.IslandMode.IncomingCall
+                        }
+                        .associate { it.key to it.timeMillis }
+                    val previous = seen
+                    seen = current
+                    // The first list is whatever was already there when the service started: no light for it.
+                    if (previous != null && current.any { (key, time) -> previous[key] != time }) {
+                        val glow = edgeGlow ?: EdgeGlowOverlay(this@SmartIslandOverlayService).also { edgeGlow = it }
+                        glow.flash()
+                    }
+                }
+            }
+        }
+
